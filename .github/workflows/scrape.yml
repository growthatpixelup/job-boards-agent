name: Daily Contra scrape

on:
  schedule:
    # Twice a day: 11 AM and 11 PM Pacific time (follows daylight saving). GitHub starts this repo's scheduled
    # runs hours late (4.5–7 h in Oct 2026), so it wakes the workflow every hour and the `gate` job lets one
    # scrape through per slot: the first wake-up at or after 11 AM or 11 PM PT. A failed scrape tries again next hour.
    - cron: "5 * * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch: # "Run workflow" button in the Actions tab; always scrapes

permissions:
  contents: read # job data lives in Supabase now, nothing is committed

concurrency:
  group: contra-scrape
  cancel-in-progress: false

jobs:
  # A few seconds per hourly wake-up. A scheduled scrape's run is saved to Supabase with daily = true, so finding
  # one since the current slot began (11 AM or 11 PM PT) means this slot's scrape is done.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          decide() { echo "go=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }
          [ "$EVENT" = "schedule" ] || { decide true "Started by hand: scraping."; exit 0; }
          # The slot we are in: it began at the latest of 11 AM today, 11 PM today, 11 PM yesterday (Pacific time).
          hour=$(TZ=America/Los_Angeles date +%-H)
          if [ "$hour" -ge 23 ]; then start='today 23:00'; elif [ "$hour" -ge 11 ]; then start='today 11:00'; else start='yesterday 23:00'; fi
          since=$(TZ=America/Los_Angeles date -d "$start" -u +%Y-%m-%dT%H:%M:%SZ)
          done=$(curl -sSf "$SUPABASE_URL/rest/v1/runs?select=ran_at&daily=eq.true&ran_at=gte.$since" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq length)
          if [ "$done" -gt 0 ]; then decide false "This slot's scrape (since $since) already ran."; else decide true "First wake-up in the slot that began $since: scraping."; fi

  scrape:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Claude reads every job once. After a change to the brief it re-reads the whole board (~230 jobs, the slow
    # case); otherwise only the few new ones.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the scraper is plain TypeScript run natively
          cache: npm

      - name: Install dependencies # for the Anthropic SDK used by the ICP classifier
        run: npm ci --no-audit --no-fund

      # Cached between runs rather than committed, so they never enter git history: job descriptions, Claude's
      # verdicts (each job is only sent to the API once; again if the job or the brief changes), the full-time
      # lead lookups (founders included) and the application briefs. GitHub deletes the cache after 7 days without use.
      - name: Restore cached descriptions, verdicts, leads and briefs
        uses: actions/cache/restore@v4
        with:
          path: |
            data/details
            data/verdicts
            data/leads
            data/briefs
          key: contra-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: contra-data-

      - name: Fetch jobs from the Contra MCP and classify
        id: scrape
        env:
          CONTRA_CLIENT_ID: ${{ secrets.CONTRA_CLIENT_ID }}
          CONTRA_REFRESH_TOKEN: ${{ secrets.CONTRA_REFRESH_TOKEN }}
          CONTRA_REFRESH_TOKEN_OUT: ${{ runner.temp }}/contra-refresh-token
          ICP_CLASSIFIER: anthropic
          ICP_MODEL: claude-sonnet-5-5
          # Full-time roles: find the company's site, LinkedIn, X and founders (web search, contra.com blocked).
          LEAD_LOOKUP: anthropic
          # Project leads: write the "why you'd be a good fit" answer for Contra's apply form (pitch.md, Claude Opus).
          APPLICATION_BRIEFS: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Runs, seen/announced job ids and stages live in Supabase; the scheduled scrape is flagged daily for the gate.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_DAILY: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: npm run scrape:ci

      # Saved straight away, even if the scrape failed partway, so a later failing step can't throw away a run's
      # paid-for verdicts and lookups (a cache saved at the end of the job is lost when any step fails).
      - name: Save cached descriptions, verdicts, leads and briefs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/details
            data/verdicts
            data/leads
            data/briefs
          key: contra-data-${{ github.run_id }}-${{ github.run_attempt }}

      # Contra may issue a new refresh token on every use; store it for tomorrow's run.
      # Writing secrets needs a fine-grained PAT with "Secrets: read and write" on this repo.
      - name: Save rotated Contra refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          f="$RUNNER_TEMP/contra-refresh-token"
          [ -f "$f" ] || { echo "Refresh token unchanged."; exit 0; }
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Contra rotated the refresh token but GH_SECRETS_PAT is not set, so the next run will fail. Add the PAT secret and re-run npm run contra:auth."
            exit 1
          fi
          gh secret set CONTRA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
          echo "Stored the new refresh token."

      # The two announcement steps run only after a successful scrape, and each runs even if the other fails.
      - name: Notify Slack
        if: ${{ !cancelled() && steps.scrape.outcome == 'success' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LEADS_SHEET_URL: ${{ vars.LEADS_SHEET_URL }} # optional repository variable: the lead sheet's link
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run notify --silent

      # Skips until the LEADS_WEBHOOK_URL secret is set (README → "Lead sheet").
      - name: Add full-time leads to the Google Sheet
        if: ${{ !cancelled() && steps.scrape.outcome == 'success' }}
        env:
          LEADS_WEBHOOK_URL: ${{ secrets.LEADS_WEBHOOK_URL }}
          LEADS_WEBHOOK_TOKEN: ${{ secrets.LEADS_WEBHOOK_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sheet --silent

  # A scrape that fails (an expired Contra token, a Supabase outage) would otherwise only show in the Actions tab,
  # and Slack would just go quiet. Skipped when the gate says not to scrape. The next hourly wake-up retries, and
  # posts again if it fails again.
  alert:
    needs: [gate, scrape]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell Slack the scrape failed
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "SLACK_WEBHOOK_URL not set; nothing to tell"; exit 0; }
          # A Workflow Builder webhook takes the `summary` and `jobs` variables; an Incoming Webhook takes `text`.
          case "$SLACK_WEBHOOK_URL" in
            */triggers/*) body=$(jq -n --arg jobs "Failed run: $RUN_URL" '{summary: "⚠️ Contra scrape failed, no jobs were checked", jobs: $jobs}') ;;
            *) body=$(jq -n --arg url "$RUN_URL" '{text: ":warning: Contra scrape failed, no jobs were checked\n<\($url)|Open the failed run>"}') ;;
          esac
          curl -sSf -X POST -H "Content-Type: application/json" -d "$body" "$SLACK_WEBHOOK_URL"
